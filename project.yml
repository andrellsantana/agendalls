name: Agenda
options:
  bundleIdPrefix: com.andrellsantana
  deploymentTarget:
    iOS: "17.0"
targets:
  Agenda:
    type: application
    platform: iOS
    sources: [Agenda]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrellsantana.agenda
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Agenda
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - sdk: libsqlite3.tbd
