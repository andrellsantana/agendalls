name: Tarefas
options:
  bundleIdPrefix: com.andrellsantana
  deploymentTarget:
    macOS: "14.0"
targets:
  Tarefas:
    type: application
    platform: macOS
    sources: [Tarefas]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrellsantana.tarefas
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tarefas
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - sdk: libsqlite3.tbd
